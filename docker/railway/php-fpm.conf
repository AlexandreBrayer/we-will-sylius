; Railway : lu après zz-docker.conf de l'image. clear_env = no : PHP reçoit les variables du service Railway.
[www]
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; Requêtes déjà journalisées par nginx
access.log = /dev/null
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; Worker recyclé après 500 requêtes : la mémoire d'un process PHP ne grossit pas indéfiniment
pm.max_requests = 500
