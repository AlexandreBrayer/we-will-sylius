# Railway (docker/railway/Dockerfile) : copie de etc/nginx/default.conf.template pour un seul conteneur.
# Écarts : PHP-FPM et le front écoutent sur 127.0.0.1 ; le protocole vient de X-Forwarded-Proto (TLS terminé par Railway),
# transmis tel quel au front (contrôle CSRF d'adapter-node) et à PHP (HTTPS=on, liens et redirections en https).
# Compression (désactivée dans le nginx.conf d'Alpine) : pages rendues par le front, API, CSS et JS. gzip_proxied : aussi
# pour les requêtes relayées par le proxy de Railway.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/ld+json
    application/problem+json application/xml image/svg+xml;

# Build Encore de prod : un fichier à empreinte (nom.0123abcd.ext) ne change jamais, gardé un an ; les autres
# (copies sans empreinte liées par le front, manifest.json…) sont revalidés à chaque chargement.
map $uri $yack_build_expires {
    "~\.[0-9a-f]{8,}\.[a-z0-9]+$" max;
    default                       epoch;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
map $http_x_forwarded_proto $yack_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $yack_proto $yack_https {
    https   on;
    default '';
}

server {
    listen 8080;
    root /srv/sylius/public;
    client_max_body_size 24m;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Contrôle de santé de Railway : nginx ne démarre qu'une fois la base prête (entrypoint.sh)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Sylius
    location = /admin { try_files /nonexistent /index.php$is_args$args; }
    location ^~ /admin/ { try_files /nonexistent /index.php$is_args$args; }
    location ^~ /api/ { try_files /nonexistent /index.php$is_args$args; }
    # Médias : noms aléatoires (images produits, médias du builder) ou dérivés (vignettes) ; fichier absent → Symfony
    location ^~ /media/ {
        expires 30d;
        try_files $uri /index.php$is_args$args;
    }
    location ^~ /bundles/ {
        expires 1d;
        try_files $uri /index.php$is_args$args;
    }
    location ^~ /build/ {
        expires $yack_build_expires;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $yack_https if_not_empty;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 300s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ "^/[a-z]{2}_[A-Z]{2}/$" {
        absolute_redirect off;
        return 301 /;
    }

    # --- Front SvelteKit
    location / {
        try_files $uri @front;
    }

    location @front {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $yack_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
