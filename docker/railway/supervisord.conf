; Railway : les trois processus du conteneur, journaux sur la sortie standard (onglet Logs de Railway).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:front]
; SvelteKit (adapter-node). SYLIUS_API_URL : l'API passe par le nginx du conteneur, comme http://nginx en local.
command=node build
directory=/srv/sylius/front
user=www-data
environment=HOME="/tmp",HOST="127.0.0.1",PORT="3000",PROTOCOL_HEADER="x-forwarded-proto",BODY_SIZE_LIMIT="24M",SYLIUS_API_URL="http://127.0.0.1:8080"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
