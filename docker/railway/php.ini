; Railway : réglages du conteneur de démo (les limites d'envoi viennent de etc/php/yack-uploads.ini).
memory_limit = 512M
date.timezone = UTC
expose_php = Off

; Production : erreurs dans les journaux, jamais dans les pages (l'image Sylius n'a pas de php.ini de production)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Image immuable : OPcache ne relit pas les fichiers PHP (cache Symfony chauffé à la construction, docker/railway/Dockerfile)
opcache.validate_timestamps = 0
; Préchargement Symfony : classes listées par le cache:warmup de l'image, chargées une fois par le maître PHP-FPM
opcache.preload = /srv/sylius/config/preload.php
opcache.preload_user = www-data

; maximum memory that OPcache can use to store compiled PHP files
opcache.memory_consumption = 256

; maximum number of files that can be stored in the cache
opcache.max_accelerated_files = 32531

; memory (in MB) for interned strings; the default value (8 MB) is too low
; for Symfony applications, which use many fully-qualified class names
opcache.interned_strings_buffer = 32

; maximum memory allocated to store the results
realpath_cache_size = 4096K

; save the results for 10 minutes (600 seconds)
realpath_cache_ttl = 600
