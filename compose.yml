services:
    php:
        image: ghcr.io/sylius/sylius-php:8.3-alpine
        environment:
            # Identifiants de démo sur la connexion du back-office (même réglage que la barre de démo du front)
            YACK_DEMO_BAR: ${YACK_DEMO_BAR:-0}
            # Recherche boutique : service meilisearch ci-dessous (le moteur se choisit par YACK_SEARCH_ENGINE dans .env.local).
            MEILISEARCH_URL: http://meilisearch:7700
            MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-yack-dev-master-key}
        volumes:
            # Limites d'envoi de fichiers (20 Mo par fichier, 24 Mo par requête), lues après le php.ini de l'image (5M / 6M).
            - ./etc/php/yack-uploads.ini:/usr/local/etc/php/conf.d/zz-yack-uploads.ini:ro
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: mysql:8.4
        platform: linux/amd64
        healthcheck:
            test: '/usr/bin/mysql --execute "SHOW databases;"'
            timeout: 3s
            interval: 1s
            retries: 10
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        cap_add:
            - SYS_NICE # prevent "mbind: Operation not permitted" errors
    nginx:
        image: ghcr.io/sylius/sylius-nginx:latest
        volumes:
            # POC Yack : /admin, /api, /media… → Sylius ; le reste → front SvelteKit
            - ./etc/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    mailhog:
        # do not use in production!
        image: mailhog/mailhog:latest
    # POC Yack : boutique headless + builder CMS SvelteKit (dossier front/, voir front/README.md),
    # servi derrière nginx (http://localhost:${HTTP_PORT}). FRONT_MODE=prod : build adapter-node + node build.
    front:
        image: node:22-alpine
        user: ${DOCKER_USER:-1000:1000}
        working_dir: /srv/sylius/front
        command:
            - sh
            - -c
            - |
                npm install --no-audit --no-fund
                if [ "$$FRONT_MODE" = "prod" ]; then npm run build && exec node build; fi
                exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort
        environment:
            FRONT_MODE: ${FRONT_MODE:-dev}
            SYLIUS_API_URL: http://nginx
            # Barre de démonstration (bascule de profil sur les comptes de démo) : YACK_DEMO_BAR=1 seulement en démo.
            YACK_DEMO_BAR: ${YACK_DEMO_BAR:-0}
            # Module « Manuels et notices » (/assistance) : 0 coupe la page et ses liens. Valeur du shell, sinon du .env (bloc
            # yack/assistance, 1) ; compose ne lit pas .env.local. L'API lit .env puis .env.local : un 0 dans .env.local seul
            # coupe l'API, et la page répond 404 dès qu'elle cherche (la barre seule reste affichée).
            YACK_ASSISTANCE: ${YACK_ASSISTANCE:-1}
            # FRONT_MODE=prod : adapter-node (SvelteKit 3) n'a pas d'origine fixe (pas de variable ORIGIN) ; il la déduit de
            # chaque requête : protocole de X-Forwarded-Proto (https par défaut, d'où ce réglage), hôte de l'en-tête Host que
            # nginx transmet tel quel. Le contrôle CSRF des formulaires reste actif et accepte donc localhost:<port> comme
            # http://<IP du Mac>:<port> (téléphone sur le même Wi-Fi), sans liste d'origines à tenir.
            PROTOCOL_HEADER: x-forwarded-proto
            PORT: 3000
            HOME: /tmp
            # FRONT_MODE=prod (adapter-node) : taille maximale d'une requête (512K par défaut), alignée sur client_max_body_size de nginx (24m) :
            # fichier de 20 Mo et enveloppe multipart.
            BODY_SIZE_LIMIT: 24M
        volumes:
            - .:/srv/sylius:rw
        depends_on:
            - nginx
    # Moteur de la recherche boutique (voir .env, bloc yack/search). Profil « search » : démarré par make yack-search-up,
    # jamais par make yack-up ; sans lui la boutique cherche en base.
    meilisearch:
        image: getmeili/meilisearch:v1.11
        profiles: [search]
        environment:
            MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-yack-dev-master-key}
            MEILI_ENV: development
            MEILI_NO_ANALYTICS: 'true'
        healthcheck:
            test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1']
            interval: 1s
            timeout: 3s
            retries: 30
        volumes:
            - meili-data:/meili_data

volumes:
    meili-data:
