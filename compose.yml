services:
    php:
        image: ghcr.io/sylius/sylius-php:8.3-alpine
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: mysql:8.4
        platform: linux/amd64
        healthcheck:
            test: '/usr/bin/mysql --execute "SHOW databases;"'
            timeout: 3s
            interval: 1s
            retries: 10
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        cap_add:
            - SYS_NICE # prevent "mbind: Operation not permitted" errors
    nginx:
        image: ghcr.io/sylius/sylius-nginx:latest
        volumes:
            # POC Yack : /admin, /api, /media… → Sylius ; le reste → front SvelteKit
            - ./etc/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    mailhog:
        # do not use in production!
        image: mailhog/mailhog:latest
    # POC Yack : boutique headless + builder CMS SvelteKit (dossier front/, voir front/README.md),
    # servi derrière nginx (http://localhost:${HTTP_PORT}). FRONT_MODE=prod : build adapter-node + node build.
    front:
        image: node:22-alpine
        user: ${DOCKER_USER:-1000:1000}
        working_dir: /srv/sylius/front
        command:
            - sh
            - -c
            - |
                npm install --no-audit --no-fund
                if [ "$$FRONT_MODE" = "prod" ]; then npm run build && exec node build; fi
                exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort
        environment:
            FRONT_MODE: ${FRONT_MODE:-dev}
            SYLIUS_API_URL: http://nginx
            # Barre de démonstration (bascule de profil sur les comptes de démo) : YACK_DEMO_BAR=1 seulement en démo.
            YACK_DEMO_BAR: ${YACK_DEMO_BAR:-0}
            ORIGIN: http://localhost:${HTTP_PORT:-80}
            # FRONT_MODE=prod : adapter-node (SvelteKit 3) ignore ORIGIN et déduit l'origine des en-têtes, en https par défaut.
            # Sans ce réglage, tout POST de formulaire du navigateur (http) est refusé en 403 (contrôle CSRF). nginx envoie X-Forwarded-Proto.
            PROTOCOL_HEADER: x-forwarded-proto
            PORT: 3000
            HOME: /tmp
            # FRONT_MODE=prod (adapter-node) : taille maximale d'une requête (512K par défaut), alignée sur client_max_body_size de nginx (20m).
            BODY_SIZE_LIMIT: 20M
        volumes:
            - .:/srv/sylius:rw
        depends_on:
            - nginx
