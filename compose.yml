services:
    php:
        image: ghcr.io/sylius/sylius-php:8.3-alpine
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: mysql:8.4
        platform: linux/amd64
        healthcheck:
            test: '/usr/bin/mysql --execute "SHOW databases;"'
            timeout: 3s
            interval: 1s
            retries: 10
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        cap_add:
            - SYS_NICE # prevent "mbind: Operation not permitted" errors
    nginx:
        image: ghcr.io/sylius/sylius-nginx:latest
    mailhog:
        # do not use in production!
        image: mailhog/mailhog:latest
    # POC Yack : builder / pages CMS SvelteKit (dossier cms/, voir docs/POC_YACK.md)
    cms:
        image: node:22-alpine
        user: ${DOCKER_USER:-1000:1000}
        working_dir: /srv/sylius/cms
        command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
        environment:
            SYLIUS_API_URL: http://nginx
            PUBLIC_SYLIUS_URL: http://localhost:${HTTP_PORT:-80}
            HOME: /tmp
        volumes:
            - .:/srv/sylius:rw
        ports:
            - "5173:5173"
        depends_on:
            - nginx
