; Envoi de fichiers (docs/adr/0005-fichiers-televerses.md), monté par compose.yml dans conf.d du service php,
; donc lu après le php.ini de l'image (5M et 6M). 20 Mo par fichier, comme les contrôles du front et de l'API ;
