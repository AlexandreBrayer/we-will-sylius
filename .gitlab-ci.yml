# Contrôles automatiques du front (SvelteKit) : typage, build, tests node. Les contrôles PHP (PHPUnit, PHPStan)
# passent par `make yack-check` sur la stack Docker ; leur job CI attend l'image Docker de production (à dater avec Alex).
stages:
    - check
    - deploy

front:
    stage: check
    image: node:22-alpine
    cache:
        key:
            files:
                - front/package-lock.json
        paths:
            - front/.npm/
    script:
        - cd front
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        - npm run check
        - npm run build
        - npm test
    rules:
        - changes:
              - front/**/*

deploy_railway:
    stage: deploy
    image: ghcr.io/railwayapp/cli:latest
    variables:
        RAILWAY_TOKEN: $RAILWAY_TOKEN
    script:
        - railway up --service=$RAILWAY_SERVICE_ID --ci
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
