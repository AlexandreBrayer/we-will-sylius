# Contrôles automatiques du front (SvelteKit). Le job PHP (composer install + PHPUnit + PHPStan)
# viendra avec l'image Docker de production : voir AGENTS.md, section Commandes.
stages:
    - check

front:
    stage: check
    image: node:22-alpine
    cache:
        key:
            files:
                - front/package-lock.json
        paths:
            - front/.npm/
    script:
        - cd front
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        - npm run check
        - npm run build
    rules:
        - changes:
              - front/**/*
