<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Erreur | Clik&amp;Yack</title>
		<!--
			Fatal error page (the layout itself could not load, e.g. Sylius unreachable): self-contained, no
			stylesheet, font, image or script to fetch. The values below copy assets/shop/styles/_tokens.scss
			(this static page cannot use the Sass tokens): keep them in step with it.
		-->
		<style>
			:root {
				--yack-magenta: #a33c87;
				--yack-magenta-dark: #7e2c68;
				--yack-magenta-10: #f6ecf3;
				--yack-dark: #2b2b2e;
				--yack-gray: #4d4d4f;
				--yack-border: #e6e6ea;
				--yack-white: #fff;
				--yack-radius-pill: 24px;
				--yack-radius-card: 12px;
				--yack-font: 'Lato', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				background: var(--yack-white);
				color: var(--yack-dark);
				font-family: var(--yack-font);
				line-height: 1.5;
			}
			main {
				width: 100%;
				max-width: 40rem;
				padding: 3rem 1.5rem;
				border: 1px solid var(--yack-border);
				border-radius: var(--yack-radius-card);
				text-align: center;
			}
			.brand {
				display: inline-block;
				margin-bottom: 2rem;
				color: var(--yack-magenta);
				font-size: 1.5rem;
				font-weight: 900;
				text-decoration: none;
			}
			.code {
				margin-bottom: 0.75rem;
				color: var(--yack-magenta);
				font-size: 5rem;
				font-weight: 900;
				line-height: 1;
			}
			h1 {
				margin: 0 0 0.75rem;
				color: var(--yack-magenta);
				font-size: 1.75rem;
			}
			p {
				margin: 0 0 2rem;
				color: var(--yack-gray);
			}
			.btn {
				display: inline-block;
				padding: 0.4375rem 1.5rem;
				border-radius: var(--yack-radius-pill);
				background: var(--yack-magenta);
				color: var(--yack-white);
				font-size: 0.875rem;
				font-weight: 700;
				line-height: 1.5rem;
				text-decoration: none;
			}
			.btn:hover,
			.btn:focus-visible {
				background: var(--yack-magenta-dark);
			}
			.btn:focus-visible {
				outline: 0;
				box-shadow: 0 0 0 0.25rem var(--yack-magenta-10);
			}
		</style>
	</head>
	<body>
		<main>
			<a href="/" class="brand" aria-label="Clik&amp;Yack, accueil">Clik&amp;Yack</a>
			<div class="code">%sveltekit.status%</div>
			<h1>Une erreur est survenue</h1>
			<p>%sveltekit.error.message%. La boutique est momentanément indisponible, réessayez dans quelques instants.</p>
			<a class="btn" href="/">Retour à l'accueil</a>
		</main>
	</body>
</html>
