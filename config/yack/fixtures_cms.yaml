                # Templates des pages communes (fiche produit, page catégorie) — App\Yack\Content\Domain\BlockType :
                # blocs liés (« produit-* », « categorie-* ») + blocs libres. Un défaut publié par type.
                # products / taxons : affectations (template produit : produits et catégories dont les produits
                # l'utilisent ; template catégorie : pages catégorie). Héritage : catégorie → sous-catégories.
                yack_cms_template:
                    options:
                        templates:
                            -   name: 'Standard'
                                type: product
                                default: true
                                blocks:
                                    -   type: produit-galerie
                                    -   type: produit-infos
                                    -   type: produit-achat
