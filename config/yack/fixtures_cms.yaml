# Pages CMS de démonstration (builder SvelteKit, dossier front/) — voir docs/POC_YACK.md
# Blocs autorisés et propriétés : App\Yack\Content\Domain\BlockType.
# Liens : « /... » = route du front SvelteKit (/produits, /sav…), « page:<slug> » = autre page CMS, sinon URL absolue.
sylius_fixtures:
    suites:
        yack:
            fixtures:
                yack_cms_page:
                    options:
                        pages:
                            accueil:
                                title: 'Accueil'
                                meta_title: 'Clik&Yack — pompes à chaleur, climatisation et pièces détachées'
                                meta_description: 'La boutique Yack des professionnels du génie climatique : PAC, climatisation, eau chaude sanitaire et pièces détachées d''origine.'
                                # Accueil cible (L2-10, démo commerciale) : bandeau et carte selon le profil, chiffres clés,
                                # accès rapides, tuiles « Nos solutions », bandeau F-Gas, produits à la une, tuiles
                                # « Nos secteurs », FAQ. Liens : routes existantes du front seulement (ni /documentation
                                # ni /commande-rapide avant L3-01b et L3-02). Visuels : les 6 visuels déjà autorisés.
                                blocks:
                                    -   type: hero
                                        props:
                                            kicker: 'Clik&Yack, la plateforme des pros du génie climatique'
                                            title: 'Chauffage, climatisation et eau chaude, commandés en quelques clics'
                                            subtitle: 'Pompes à chaleur, climatisation, eau chaude sanitaire et pièces détachées d''origine, avec le SAV par numéro de série au même endroit.'
                                            image: ''
                                            theme: 'magenta'
                                            ctaLabel: 'Voir le catalogue'
                                            ctaUrl: '/produits'
                                            cta2Label: 'Trouver une pièce par n° de série'
                                            cta2Url: '/sav'
                                            card: 'profil'
                                    # Contenu de démonstration : chiffres repris de la démo commerciale, à valider par Yack.
                                    -   type: chiffres-cles
                                        props:
                                            title: ''
                                            theme: 'sombre'
                                            value1: '24 h'
                                            label1: '75 % du marché livré en 24 h depuis Fos-sur-Mer'
                                            value2: '+ 4 000'
                                            label2: 'références de pièces détachées en stock'
                                            value3: 'Proche'
                                            label3: 'un commercial Yack dans votre région'
                                            value4: 'Qualiopi'
                                            label4: 'formations certifiées au Yack Technical Institute'
                                    -   type: acces-rapides
                                        props:
                                            title: ''
                                            icon1: 'recherche'
                                            label1: 'Pièces détachées'
                                            text1: 'Le n° de série suffit : modèle, vue éclatée, pièces d''origine.'
                                            url1: '/sav'
                                            icon2: 'france'
                                            label2: 'Trouver un installateur'
                                            text2: 'Un réseau de pros près de chez vos clients.'
                                            url2: '/trouver-un-installateur'
                                            highlight2: 'oui'
                                            icon3: 'panier'
                                            label3: 'Catalogue'
                                            text3: 'Pompes à chaleur, climatisation, eau chaude sanitaire.'
                                            url3: '/produits'
                                            icon4: 'compte'
                                            label4: 'Me connecter'
                                            text4: 'Votre espace PRO ou ECOM.'
                                            url4: '/connexion'
                                    -   type: tuiles
                                        props:
                                            title: 'Nos solutions'
                                            layout: 'grande-quatre'
                                            label1: 'Pompes à chaleur air/eau'
                                            image1: 'yack/cms/pac-monobloc.png'
                                            url1: '/produits/pompes-a-chaleur/air-eau'
                                            label2: 'Pompes à chaleur air/air'
                                            image2: 'yack/cms/pac-split.png'
                                            url2: '/produits/pompes-a-chaleur/air-air'
                                            label3: 'Climatiseurs muraux'
                                            image3: 'yack/cms/split-mural.png'
                                            url3: '/produits/climatisation/muraux'
                                            label4: 'Gainables et cassettes'
                                            image4: 'yack/cms/gainable.png'
                                            url4: '/produits/climatisation/gainables-cassettes'
                                            label5: 'Eau chaude sanitaire'
                                            image5: 'yack/cms/ballon-thermo.png'
                                            url5: '/produits/eau-chaude-sanitaire'
                                    # Contenu de démonstration : texte F-Gas à faire valider par Yack.
                                    -   type: cta
                                        props:
                                            kicker: 'Réglementation F-Gas'
                                            title: 'Les fluides frigorigènes à faible impact'
                                            text: 'Retrouvez nos pompes à chaleur air/eau et leur fluide frigorigène dans le catalogue.'
                                            theme: 'jaune'
                                            ctaLabel: 'Voir les PAC air/eau'
                                            ctaUrl: '/produits/pompes-a-chaleur/air-eau'
                                    -   type: produits
                                        props:
                                            title: 'À la une'
                                            subtitle: ''
                                            productCodes: 'YK-PAE-M08, YK-PAE-S11, YK-PAA-K35, YK-ECS-T200'
                                    # Pas encore de filtre par secteur (L3-03) : les secteurs mènent aux rubriques du catalogue.
                                    -   type: tuiles
                                        props:
                                            title: 'Nos secteurs'
                                            layout: 'grille'
                                            label1: 'Résidentiel'
                                            image1: 'yack/cms/pac-monobloc.png'
                                            url1: '/produits/pompes-a-chaleur'
                                            label2: 'Petit tertiaire'
                                            image2: 'yack/cms/console.png'
                                            url2: '/produits/climatisation'
                                            label3: 'Tertiaire'
                                            image3: 'yack/cms/gainable.png'
                                            url3: '/produits/climatisation/gainables-cassettes'
                                            label4: 'Pièces détachées'
                                            image4: 'yack/cms/split-mural.png'
                                            url4: '/pieces'
                                    -   type: faq
                                        props:
                                            title: 'Questions fréquentes'
                                            items: |
                                                Comment voir les prix ? | Les prix sont réservés aux comptes ECOM : créez un compte PRO puis demandez l'ouverture à la commande depuis votre espace client.
                                                Comment retrouver une pièce détachée ? | Depuis la rubrique SAV, à partir du numéro de série inscrit sur la plaque signalétique de l'appareil.
                                                Comment trouver un installateur ? | L'annuaire des installateurs partenaires se consulte par secteur, gamme et activité.

                            nos-services:
                                title: 'Nos services'
                                meta_title: 'Nos services aux installateurs — Yack'
                                meta_description: 'SAV et pièces détachées, réseau d''installateurs partenaires, conseil technique : les services Yack.'
                                blocks:
                                    -   type: hero
                                        props:
                                            title: 'Nos services'
                                            subtitle: 'Yack accompagne les installateurs avant, pendant et après le chantier.'
                                            image: ''
                                            theme: 'sombre'
                                            ctaLabel: ''
                                            ctaUrl: ''
                                    -   type: chiffres-cles
                                        props:
                                            title: ''
                                            theme: 'clair'
                                            value1: '48 h'
                                            label1: 'Livraison sur chantier ou en agence'
                                            value2: '5 ans'
                                            label2: 'Garantie sur les compresseurs'
                                            value3: '16'
                                            label3: 'Installateurs partenaires dans le réseau de démo'
                                    -   type: texte-image
                                        props:
                                            title: 'SAV & pièces détachées'
                                            text: 'Vues éclatées interactives, pièces d''origine avec prix et stock, ajout au même panier que vos équipements.'
                                            image: 'yack/cms/pac-split.png'
                                            imagePosition: 'gauche'
                                            ctaLabel: 'Accéder au SAV'
                                            ctaUrl: '/sav'
                                    -   type: texte-image
                                        props:
                                            title: 'Un réseau d''installateurs partenaires'
                                            text: 'Particuliers : trouvez un professionnel qualifié près de chez vous, par secteur, gamme et activité.'
                                            image: 'yack/cms/console.png'
                                            imagePosition: 'droite'
                                            ctaLabel: 'Trouver un installateur'
                                            ctaUrl: '/trouver-un-installateur'
                                    -   type: faq
                                        props:
                                            title: 'Questions fréquentes'
                                            items: |
                                                Comment voir les prix ? | Les prix sont réservés aux comptes ECOM : créez un compte PRO puis demandez l'ouverture à la commande depuis votre espace client.
                                                Quels moyens de paiement ? | Virement sous 15 jours ou carte bancaire (escompte de 2 %), ou virement à échéance.
                                                Comment retrouver une pièce ? | Depuis la rubrique SAV, à partir du numéro de série inscrit sur la plaque signalétique de l'appareil.
                                    -   type: cta
                                        props:
                                            title: 'Une question sur un chantier ?'
                                            text: 'Nos techniciens vous répondent du lundi au vendredi.'
                                            theme: 'magenta'
                                            ctaLabel: 'Nous contacter'
                                            ctaUrl: '/contact'

                # Templates des pages communes (fiche produit, page catégorie) — App\Yack\Content\Domain\BlockType :
                # blocs liés (« produit-* », « categorie-* ») + blocs libres. Un défaut publié par type.
                # products / taxons : affectations (template produit : produits et catégories dont les produits
                # l'utilisent ; template catégorie : pages catégorie). Héritage : catégorie → sous-catégories.
                yack_cms_template:
                    options:
                        templates:
                            -   name: 'Standard'
                                type: product
                                default: true
                                blocks:
                                    -   type: produit-galerie
                                    -   type: produit-infos
                                    -   type: produit-achat
                                    -   type: produit-sav
                                        props:
                                            title: 'Une pièce détachée pour cet appareil ?'
                                            text: 'Saisissez le numéro de série de l''appareil pour retrouver ses vues éclatées et ses pièces d''origine.'
                                    -   type: produit-description
                                        props:
                                            title: 'Détails'
                                    -   type: produit-caracteristiques
                                        props:
                                            title: 'Attributs'

                            -   name: 'PAC premium'
                                type: product
                                taxons: ['pac_air_eau']
                                blocks:
                                    -   type: hero
                                        props:
                                            title: 'Pompes à chaleur air/eau Clik&Yack'
                                            subtitle: 'Jusqu''à 5 ans de garantie sur les compresseurs, mise en service accompagnée par nos techniciens.'
                                            image: 'yack/cms/pac-monobloc.png'
                                            theme: 'sombre'
                                            ctaLabel: 'Trouver un installateur'
                                            ctaUrl: '/trouver-un-installateur'
                                    -   type: produit-galerie
                                    -   type: produit-infos
                                    -   type: produit-achat
                                    -   type: reassurance
                                        props:
                                            title: ''
                                            icon1: 'garantie'
                                            title1: 'Garantie 5 ans'
                                            text1: 'Pièces et compresseur'
                                            icon2: 'livraison'
                                            title2: 'Livraison 48 h'
                                            text2: 'Sur chantier ou en agence'
                                            icon3: 'conseil'
                                            title3: 'Aide au dimensionnement'
                                            text3: 'Hotline technique dédiée'
                                            icon4: 'eco'
                                            title4: 'Éligible aux aides'
                                            text4: 'MaPrimeRénov'', CEE'
                                    -   type: produit-description
                                        props:
                                            title: 'Détails'
                                    -   type: produit-caracteristiques
                                        props:
                                            title: 'Caractéristiques techniques'
                                    -   type: produit-sav
                                        props:
                                            title: 'Une pièce détachée pour cette PAC ?'
                                            text: 'Saisissez le numéro de série de l''appareil pour retrouver ses vues éclatées et ses pièces d''origine.'
                                    -   type: faq
                                        props:
                                            title: 'Questions fréquentes sur les PAC air/eau'
                                            items: |
                                                Quelle puissance choisir ? | Elle dépend des déperditions du logement : notre hotline technique vous aide à dimensionner l'installation.
                                                Monobloc ou split ? | La monobloc se raccorde sans manipulation de fluide frigorigène ; le split sépare le module hydraulique, installé à l'intérieur.
                                                Quelles aides pour mes clients ? | Les PAC air/eau Clik&Yack sont éligibles à MaPrimeRénov' et aux CEE lorsqu'elles sont posées par un professionnel RGE.

                            -   name: 'Standard'
                                type: taxon
                                default: true
                                blocks:
                                    -   type: categorie-entete
                                        props:
                                            description: 'oui'
                                    -   type: categorie-produits
                                        props:
                                            perPage: '9'
                                            sort: 'position'

                            -   name: 'Pièces détachées'
                                type: taxon
                                taxons: ['clik_yack_parts']
                                blocks:
                                    -   type: categorie-entete
                                        props:
                                            description: 'oui'
                                    -   type: cta
                                        props:
                                            title: 'Vous cherchez la pièce d''un appareil précis ?'
                                            text: 'Saisissez son numéro de série : vues éclatées et pièces d''origine compatibles, avec leur disponibilité.'
                                            theme: 'magenta'
                                            ctaLabel: 'Rechercher par n° de série'
                                            ctaUrl: '/sav'
                                    -   type: categorie-sous-categories
                                        props:
                                            title: 'Familles de pièces'
                                    -   type: categorie-produits
                                        props:
                                            perPage: '18'
                                            sort: 'nom-asc'
