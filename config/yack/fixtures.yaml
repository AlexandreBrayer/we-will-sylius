# Suite de fixtures "yack" : bin/console sylius:fixtures:load yack
# Socle boutique (canal, taxonomie, attributs, comptes) puis catalogue via le pipeline de synchro PIM/ERP.
sylius_fixtures:
    suites:
        yack:
            listeners:
                orm_purger: ~
                images_purger: ~
                logger: ~

            fixtures:
                locale:
                    options:
                        locales: ['fr_FR']

                currency:
                    options:
                        currencies: ['EUR']

                geographical:
                    options:
                        countries: ['FR', 'BE', 'CH', 'LU', 'MC']
                        zones:
                            FR:
                                name: 'France métropolitaine'
                                countries: ['FR', 'MC']
                            EU_FR:
                                name: 'Pays francophones limitrophes'
                                countries: ['BE', 'CH', 'LU']

                yack_taxon:
                    name: taxon
                    options:
                        custom:
                            menu:
                                code: 'yack_menu'
                                name: 'Menu'
                                translations:
                                    fr_FR: { name: 'Menu', slug: 'menu', description: '' }
                                children:
                                    -   code: 'nos_produits'
                                        translations:
                                            fr_FR: { name: 'Nos produits', slug: 'nos-produits', description: 'Tout le catalogue Yack : produits finis et pièces détachées.' }
                                        children:
                                            -   code: 'clik_yack'
                                                translations:
                                                    fr_FR: { name: 'Clik&Yack', slug: 'nos-produits/clik-yack', description: 'Pompes à chaleur, climatisation et eau chaude sanitaire.' }
                                                children:
                                                    -   code: 'pompes_a_chaleur'
                                                        translations:
                                                            fr_FR: { name: 'Pompes à chaleur', slug: 'nos-produits/clik-yack/pompes-a-chaleur', description: '' }
                                                        children:
                                                            -   code: 'pac_air_eau'
                                                                translations:
                                                                    fr_FR: { name: 'PAC air/eau', slug: 'nos-produits/clik-yack/pompes-a-chaleur/air-eau', description: '' }
                                                            -   code: 'pac_air_air'
                                                                translations:
                                                                    fr_FR: { name: 'PAC air/air', slug: 'nos-produits/clik-yack/pompes-a-chaleur/air-air', description: '' }
                                                    -   code: 'climatisation'
                                                        translations:
                                                            fr_FR: { name: 'Climatisation', slug: 'nos-produits/clik-yack/climatisation', description: '' }
                                                        children:
                                                            -   code: 'clim_murale'
                                                                translations:
                                                                    fr_FR: { name: 'Climatiseurs muraux', slug: 'nos-produits/clik-yack/climatisation/muraux', description: '' }
                                                            -   code: 'clim_gainable_cassette'
                                                                translations:
                                                                    fr_FR: { name: 'Gainables & cassettes', slug: 'nos-produits/clik-yack/climatisation/gainables-cassettes', description: '' }
                                                            -   code: 'clim_mobile'
                                                                translations:
                                                                    fr_FR: { name: 'Climatiseurs mobiles', slug: 'nos-produits/clik-yack/climatisation/mobiles', description: '' }
                                                    -   code: 'eau_chaude_sanitaire'
                                                        translations:
                                                            fr_FR: { name: 'Eau chaude sanitaire', slug: 'nos-produits/clik-yack/eau-chaude-sanitaire', description: '' }
                                                        children:
                                                            -   code: 'ballons_thermodynamiques'
                                                                translations:
                                                                    fr_FR: { name: 'Ballons thermodynamiques', slug: 'nos-produits/clik-yack/eau-chaude-sanitaire/thermodynamiques', description: '' }
                                                            -   code: 'ballons_ecs'
                                                                translations:
                                                                    fr_FR: { name: 'Ballons électriques & solaires', slug: 'nos-produits/clik-yack/eau-chaude-sanitaire/electriques-solaires', description: '' }
                                            -   code: 'clik_yack_parts'
                                                translations:
                                                    fr_FR: { name: 'Clik&Yack Parts', slug: 'nos-produits/clik-yack-parts', description: 'Pièces détachées d''origine, retrouvées depuis le numéro de série (rubrique SAV).' }
                                                children:
                                                    -   code: 'parts_electronique'
                                                        translations:
                                                            fr_FR: { name: 'Cartes & électronique', slug: 'nos-produits/clik-yack-parts/electronique', description: '' }
                                                    -   code: 'parts_compresseurs'
                                                        translations:
                                                            fr_FR: { name: 'Compresseurs', slug: 'nos-produits/clik-yack-parts/compresseurs', description: '' }
                                                    -   code: 'parts_ventilation'
                                                        translations:
                                                            fr_FR: { name: 'Ventilation', slug: 'nos-produits/clik-yack-parts/ventilation', description: '' }
                                                    -   code: 'parts_frigorifique'
                                                        translations:
                                                            fr_FR: { name: 'Circuit frigorifique', slug: 'nos-produits/clik-yack-parts/frigorifique', description: '' }
                                                    -   code: 'parts_hydraulique'
                                                        translations:
                                                            fr_FR: { name: 'Hydraulique', slug: 'nos-produits/clik-yack-parts/hydraulique', description: '' }
                                                    -   code: 'parts_sondes'
                                                        translations:
                                                            fr_FR: { name: 'Sondes & capteurs', slug: 'nos-produits/clik-yack-parts/sondes', description: '' }
                                                    -   code: 'parts_commandes'
                                                        translations:
                                                            fr_FR: { name: 'Commandes & régulation', slug: 'nos-produits/clik-yack-parts/commandes', description: '' }
                                                    -   code: 'parts_consommables'
                                                        translations:
                                                            fr_FR: { name: 'Filtres & consommables', slug: 'nos-produits/clik-yack-parts/consommables', description: '' }
                            marques:
                                code: 'marques'
                                translations:
                                    fr_FR: { name: 'Marques', slug: 'marques', description: '' }
                                children:
                                    -   code: 'marque_yack'
                                        translations:
                                            fr_FR: { name: 'Yack', slug: 'marques/yack', description: '' }
                                    -   code: 'marque_aerys'
                                        translations:
                                            fr_FR: { name: 'Aerys', slug: 'marques/aerys', description: '' }
                                    -   code: 'marque_hydrolia'
                                        translations:
                                            fr_FR: { name: 'Hydrolia', slug: 'marques/hydrolia', description: '' }
                                    -   code: 'marque_calyos'
                                        translations:
                                            fr_FR: { name: 'Calyos', slug: 'marques/calyos', description: '' }

                channel:
                    options:
                        custom:
                            yack_web:
                                name: 'Clik&Yack'
                                code: 'YACK_WEB'
                                locales: ['fr_FR']
                                default_locale: 'fr_FR'
                                currencies: ['EUR']
                                base_currency: 'EUR'
                                enabled: true
                                hostname: '%env(resolve:SYLIUS_FIXTURES_HOSTNAME)%'
                                theme_name: ~
                                color: '#A7357F'
                                # Inscription : compte désactivé jusqu'au clic sur le lien d'activation (e-mail)
                                account_verification_required: true
                                default_tax_zone: 'FR'
                                tax_calculation_strategy: 'order_items_based'
                                menu_taxon: 'yack_menu'
                                contact_email: 'contact@yack.test'
                                contact_phone_number: '+33 4 00 00 00 00'
                                shop_billing_data:
                                    company: 'Yack (démo POC)'
                                    tax_id: 'FR00000000000'
                                    country_code: 'FR'
                                    street: '1 avenue de la Démo'
                                    city: 'Aix-en-Provence'
                                    postcode: '13100'

                payment_method:
                    options:
                        custom:
                            virement_15j:
                                code: 'virement_15j'
                                name: 'Virement sous 15 jours'
                                description: 'Escompte de 2 % pour un règlement par virement sous 15 jours.'
                                instructions: 'Virement à effectuer sous 15 jours sur le compte Yack indiqué sur la facture (démo).'
                                channels: ['YACK_WEB']
                                enabled: true
                            carte_bancaire:
                                code: 'carte_bancaire'
                                name: 'Carte bancaire'
                                description: 'Paiement comptant par carte : escompte de 2 %. (POC : passerelle hors ligne, aucun débit réel.)'
                                channels: ['YACK_WEB']
                                enabled: true
                            virement_echeance:
                                code: 'virement_echeance'
                                name: 'Virement à échéance'
                                description: 'Règlement à échéance de facture, prix normal sans escompte.'
                                instructions: 'Virement à échéance de facture (démo).'
                                channels: ['YACK_WEB']
                                enabled: true

                # Avant shipping_method : la catégorie de taxe des frais de port (tva_normale) doit exister à son chargement
                tax_category:
                    options:
                        custom:
                            tva_normale:
                                code: 'tva_normale'
                                name: 'TVA taux normal'

                tax_rate:
                    options:
                        custom:
                            tva_20:
                                code: 'tva_20'
                                name: 'TVA 20 %'
                                zone: 'FR'
                                category: 'tva_normale'
                                amount: 0.2
                                included_in_price: false

                shipping_method:
                    options:
                        custom:
                            yack_transport:
                                code: 'yack_transport'
                                name: 'Livraison transporteur (24/48 h)'
                                description: 'Livraison sur chantier ou à l''adresse de votre choix.'
                                enabled: true
                                # Frais de port soumis à la TVA du taux des produits (20 %)
                                tax_category: 'tva_normale'
                                zone: 'FR'
                                channels: ['YACK_WEB']
                                calculator:
                                    type: 'flat_rate'
                                    configuration:
                                        YACK_WEB: { amount: 1990 }
                            yack_agence:
                                code: 'yack_agence'
                                name: 'Retrait en agence Yack'
                                description: 'Disponible dès 2 h dans votre agence.'
                                enabled: true
                                # Frais de port soumis à la TVA du taux des produits (20 %)
                                tax_category: 'tva_normale'
                                zone: 'FR'
                                channels: ['YACK_WEB']
                                calculator:
                                    type: 'flat_rate'
                                    configuration:
                                        YACK_WEB: { amount: 0 }

                customer_group:
                    options:
                        custom:
                            pro:
                                code: 'pro'
                                name: 'PRO — installateurs (sans prix ni commande en ligne)'
                            ecom:
                                code: 'ecom'
                                name: 'ECOM — clients e-commerce (prix et commande en ligne)'

                shop_user:
                    name: 'shop_user'
                    options:
                        custom:
                            -   email: 'ecom@yack.test'
                                first_name: 'Émilie'
                                last_name: 'Ecom'
                                phone_number: '04 42 00 00 10'
                                password: 'yack'
                                customer_group: 'ecom'
                            -   email: 'pro@yack.test'
                                first_name: 'Julien'
                                last_name: 'Installateur'
                                phone_number: '04 42 00 00 01'
                                password: 'yack'
                                customer_group: 'pro'
                            -   email: 'pro2@yack.test'
                                first_name: 'Sophie'
                                last_name: 'Thermicienne'
                                phone_number: '04 91 00 00 02'
                                password: 'yack'
                                customer_group: 'pro'

                yack_customer_company:
                    options:
                        customers:
                            'ecom@yack.test':
                                company: 'Clim Express'
                                address: { street: '10 rue du Soleil', postcode: '13100', city: 'Aix-en-Provence', phone_number: '04 42 00 00 10' }
                            'pro@yack.test':
                                company: 'Provence Clim Services'
                                siret: '81234567800013'
                                vat_number: 'FR25812345678'
                                address: { street: '25 avenue de la Pinède', postcode: '13090', city: 'Aix-en-Provence' }
                            'pro2@yack.test':
                                company: 'Thermi-Sud Énergies'
                                siret: '79876543200025'
                                address: { street: '8 boulevard de la Méditerranée', postcode: '13008', city: 'Marseille' }

                admin_user:
                    name: 'admin_user'
                    options:
                        custom:
                            -   email: 'admin@yack.test'
                                username: 'admin'
                                password: 'yack'
                                enabled: true
                                locale_code: 'fr_FR'
                                first_name: 'Admin'
                                last_name: 'Yack'
                                # ROLE_API_ACCESS : connexion au builder CMS (JWT de l'API admin Sylius)
                                api: true

                product_attribute:
                    options:
                        custom:
                            -   name: 'Type d''article'
                                code: 'type_article'
                                type: 'text'
                                translatable: false
                            -   name: 'Marque'
                                code: 'marque'
                                type: 'text'
                                translatable: false
                            -   name: 'Gamme'
                                code: 'gamme'
                                type: 'text'
                                translatable: false
                            -   name: 'Puissance (kW)'
                                code: 'puissance_kw'
                                type: 'float'
                                translatable: false
                            -   name: 'SCOP'
                                code: 'scop'
                                type: 'float'
                                translatable: false
                            -   name: 'Fluide frigorigène'
                                code: 'fluide_frigorigene'
                                type: 'text'
                                translatable: false
                            -   name: 'Capacité (litres)'
                                code: 'capacite_litres'
                                type: 'integer'
                                translatable: false
                            -   name: 'Référence constructeur'
                                code: 'reference_constructeur'
                                type: 'text'
                                translatable: false

                yack_catalog:
                    options:
                        feed: 'data/yack/catalog.json'
