when@dev:
    web_profiler:
        toolbar: true

    # Le profiler double le temps de chaque appel API : il ne collecte que sur demande (?_profile=1 dans l'URL).
    framework:
        profiler:
            collect: false
            collect_parameter: _profile
            collect_serializer_data: true

when@test: &web_profiler_test
    web_profiler:
        toolbar: false
        intercept_redirects: false

    framework:
        profiler:
            collect: false
            collect_serializer_data: true

when@test_cached: *web_profiler_test
