# POC Yack — configuration applicative (voir docs/POC_YACK.md)
imports:
    - { resource: '../yack/fixtures.yaml' }
    - { resource: '../yack/fixtures_after_sales.yaml' }

parameters:
    app.yack.channel_code: 'YACK_WEB'
    app.yack.locale: 'fr_FR'
    app.yack.tax_category_code: 'tva_normale'
    # Escompte (% du HT) accordé selon le moyen de paiement choisi au checkout (codes des moyens de paiement).
    # 0 = pas d'escompte ; un moyen absent de la liste retombe sur l'escompte propre au client (BO > Clients).
    app.yack.payment_method_escompte_rates:
        virement_15j: 2
        carte_bancaire: 2
        virement_echeance: 0
    # Modalités de paiement (page de confirmation, e-mail, détail de commande). RIB fictif (démo).
    app.yack.payment_terms.bank_account:
        holder: 'YACK SAS (compte de démonstration)'
        bank: 'Banque Fictive du Sud — Aix-en-Provence'
        iban: 'FR76 3000 1007 9412 3456 7890 185'
        bic: 'BFSUFRPPXXX'
    app.yack.payment_terms.methods:
        virement_15j: { kind: 'virement', due_days: 15 }
        virement_echeance: { kind: 'virement', due_days: 30 }
        carte_bancaire: { kind: 'carte' }

# E-mails transactionnels Yack (gabarit shop/yack/email/layout.html.twig). En local : MailHog, http://localhost:8025
sylius_mailer:
    sender:
        name: 'Clik&Yack'
        address: 'no-reply@yack.test'
    emails:
        order_confirmation:
            template: 'shop/yack/email/order_confirmation.html.twig'
        order_confirmation_resent:
            template: 'shop/yack/email/order_confirmation.html.twig'
        shipment_confirmation:
            template: 'shop/yack/email/shipment_confirmation.html.twig'
        shipment_confirmation_resent:
            template: 'shop/yack/email/shipment_confirmation.html.twig'
        verification_token:
            template: 'shop/yack/email/account_verification.html.twig'
        reset_password_token:
            template: 'shop/yack/email/password_reset.html.twig'
        user_registration:
            template: 'shop/yack/email/user_registration.html.twig'
        yack_order_access_granted:
            subject: 'Votre compte est ouvert à la commande'
            template: 'shop/yack/email/order_access_granted.html.twig'

sylius_grid:
    grids:
        # Historique des commandes (compte client) : date FR, paiement + livraison, pas de bouton "Payer"
        # (virement : le RIB est sur le détail de commande ; carte : déjà réglée au checkout).
        sylius_shop_account_order:
            fields:
                checkoutCompletedAt:
                    options:
                        format: d/m/Y
                state:
                    enabled: false
                yack_payment:
                    type: twig
                    label: Paiement
                    path: .
                    options:
                        template: 'shop/yack/order/grid/payment.html.twig'
                yack_shipping:
                    type: twig
                    label: Livraison
                    path: .
                    options:
                        template: 'shop/yack/order/grid/shipping.html.twig'
            actions:
                item:
                    pay:
                        enabled: false

        # BO > Commandes : moyen de paiement + escompte (canal et devise uniques : colonnes masquées)
        sylius_admin_order:
            fields:
                channel:
                    enabled: false
                currencyCode:
                    enabled: false
                yack_payment:
                    type: twig
                    label: Paiement / escompte
                    path: .
                    options:
                        template: 'admin/yack/order/grid/payment.html.twig'

        # BO > Clients : profil PRO/ECOM, société, SIRET + filtre rapide par profil
        sylius_admin_customer:
            fields:
                yack_profile:
                    type: twig
                    label: Profil
                    path: .
                    options:
                        template: 'admin/yack/customer/grid/profile.html.twig'
                company:
                    type: string
                    label: Société
                    sortable: ~
                siret:
                    type: string
                    label: SIRET
            filters:
                yack_profile:
                    type: select
                    label: Profil
                    form_options:
                        choices:
                            PRO: pro
                            ECOM: ecom
                    options:
                        field: group.code
                search:
                    options:
                        fields: [email, firstName, lastName, company, siret]

sylius_twig_hooks:
    hooks:
        # --- Profils PRO / ECOM : chaque bloc "prix" ou "panier" déclare la permission requise.
        #     La règle elle-même vit dans App\Yack\Account (voter), voir PermissionAwareHookableRenderer.
        'sylius_shop.shared.product.card':
            prices:
                configuration: { yack_permission: 'YACK_SEE_PRICES' }
            yack_pricing_notice:
                template: 'shop/yack/account/card_pricing_notice.html.twig'
                priority: -10

        'sylius_shop.product.show.content.info.summary':
            prices:
                configuration: { yack_permission: 'YACK_SEE_PRICES' }
            catalog_promotions:
                configuration: { yack_permission: 'YACK_SEE_PRICES' }
            add_to_cart:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }
            paypal_checkout:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }
            yack_pricing_notice:
                template: 'shop/yack/account/product_pricing_notice.html.twig'
                priority: 150
            yack_after_sales_link:
                template: 'shop/yack/sav/product_after_sales_link.html.twig'
                priority: -50

        'sylius_shop.base.header.content':
            logo:
                template: 'shop/yack/layout/header_logo.html.twig'
            yack_search:
                template: 'shop/yack/layout/header_search.html.twig'
                priority: 250
            cart:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }

        'sylius_shop.base.offcanvas':
            cart:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }

        # --- Escompte selon le moyen de paiement (App\OrderProcessing\EscompteProcessor)
        'sylius_shop.shared.form.select_payment.payment.choice.details':
            yack_escompte:
                template: 'shop/yack/checkout/payment_escompte_badge.html.twig'
                priority: -10

        'sylius_shop.checkout.common.sidebar.summary.total':
            yack_escompte:
                template: 'shop/yack/checkout/sidebar_escompte.html.twig'
                priority: 250

        'sylius_shop.cart.index.content.form.sections.general.summary':
            yack_escompte:
                template: 'shop/yack/cart/summary_escompte.html.twig'
                priority: 350

        'sylius_admin.order.show.content.sections.summary':
            yack_escompte:
                template: 'admin/yack/order/summary_escompte.html.twig'
                priority: -10

        # --- Back-office Yack : tableau de bord, fiche client, habillage
        'sylius_admin.dashboard.index.content.latest_statistics':
            yack_pro_signups:
                template: 'admin/yack/dashboard/pro_signups.html.twig'
                priority: -10

        'sylius_admin.dashboard.index.content.latest_statistics.pending_actions.body':
            yack_order_access_requests:
                template: 'admin/yack/dashboard/pending_order_access_requests.html.twig'
                priority: 450

        'sylius_admin.customer.show.content.sections.general':
            yack_company:
                template: 'admin/yack/customer/show/company.html.twig'
                priority: 650

        'sylius_admin.customer.show.content.sections':
            yack_order_access_requests:
                template: 'admin/yack/customer/show/order_access_requests.html.twig'
                priority: 50

        'sylius_admin.common.component.sidebar.logo':
            image:
                template: 'admin/yack/layout/sidebar_logo.html.twig'

        # --- Tunnel de commande : progression Adresse › Livraison › Paiement › Récapitulatif › Confirmation
        'sylius_shop.checkout.address.content':
            steps:
                template: 'shop/yack/checkout/steps.html.twig'

        'sylius_shop.checkout.select_shipping.content':
            steps:
                template: 'shop/yack/checkout/steps.html.twig'

        'sylius_shop.checkout.select_payment.content':
            steps:
                template: 'shop/yack/checkout/steps.html.twig'

        'sylius_shop.checkout.complete.content':
            steps:
                template: 'shop/yack/checkout/steps.html.twig'

        # Confirmation : RIB + référence + échéance (virement) ou paiement carte accepté (App\Yack\Payment)
        'sylius_shop.order.thank_you.content':
            yack_steps:
                template: 'shop/yack/checkout/steps.html.twig'
                configuration: { active_step: 'confirmation' }
                priority: 300
            header:
                template: 'shop/yack/order/thank_you/header.html.twig'
            payment_instruction:
                template: 'shop/yack/order/thank_you/payment_instruction.html.twig'

        # Détail de commande (compte client) : moyen de paiement, modalités, suivi colis
        'sylius_shop.account.order.show.content.main.header.details':
            yack_payment_method:
                template: 'shop/yack/order/show/payment_method.html.twig'
                priority: 150

        'sylius_shop.account.order.show.content.main':
            yack_payment_instruction:
                template: 'shop/yack/order/show/payment_instruction.html.twig'
                priority: 10

        'sylius_shop.shared.order.show.summary.statuses.shipments.list':
            yack_tracking:
                template: 'shop/yack/order/show/shipment_tracking.html.twig'
                priority: 50

        # --- Habillage Yack (léger)
        'sylius_shop.base.header.top_bar':
            info_message:
                template: 'shop/yack/layout/top_bar_message.html.twig'
            yack_profile:
                template: 'shop/yack/layout/top_bar_profile.html.twig'
                priority: 50

        'sylius_shop.base.header.content.logo':
            content:
                template: 'shop/yack/layout/logo.html.twig'

        'sylius_shop.base.footer.content':
            payment_methods:
                enabled: false
            copy:
                template: 'shop/yack/layout/footer_copy.html.twig'

        'sylius_shop.checkout.common.header':
            logo:
                template: 'shop/yack/layout/checkout_logo.html.twig'

        'sylius_shop.base.header.content.security.logged_in_user.desktop':
            welcome_message:
                template: 'shop/yack/layout/welcome_message.html.twig'

        'sylius_shop.base.header.navbar.menu':
            yack_links_before:
                template: 'shop/yack/layout/menu_links_before.html.twig'
                priority: 100
            yack_links:
                template: 'shop/yack/layout/menu_links.html.twig'
                priority: -100

        'sylius_shop.homepage.index':
            banner:
                template: 'shop/yack/homepage/hero.html.twig'
            new_collection:
                enabled: false
