# POC Yack — configuration applicative (voir docs/POC_YACK.md)
imports:
    - { resource: '../yack/fixtures.yaml' }
    - { resource: '../yack/fixtures_after_sales.yaml' }

parameters:
    app.yack.channel_code: 'YACK_WEB'
    app.yack.locale: 'fr_FR'
    app.yack.tax_category_code: 'tva_normale'
    # Escompte (% du HT) accordé selon le moyen de paiement choisi au checkout (codes des moyens de paiement).
    # 0 = pas d'escompte ; un moyen absent de la liste retombe sur l'escompte propre au client (BO > Clients).
    app.yack.payment_method_escompte_rates:
        virement_15j: 2
        carte_bancaire: 2
        virement_echeance: 0

sylius_twig_hooks:
    hooks:
        # --- Profils PRO / ECOM : chaque bloc "prix" ou "panier" déclare la permission requise.
        #     La règle elle-même vit dans App\Yack\Account (voter), voir PermissionAwareHookableRenderer.
        'sylius_shop.shared.product.card':
            prices:
                configuration: { yack_permission: 'YACK_SEE_PRICES' }
            yack_pricing_notice:
                template: 'shop/yack/account/card_pricing_notice.html.twig'
                priority: -10

        'sylius_shop.product.show.content.info.summary':
            prices:
                configuration: { yack_permission: 'YACK_SEE_PRICES' }
            catalog_promotions:
                configuration: { yack_permission: 'YACK_SEE_PRICES' }
            add_to_cart:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }
            paypal_checkout:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }
            yack_pricing_notice:
                template: 'shop/yack/account/product_pricing_notice.html.twig'
                priority: 150
            yack_after_sales_link:
                template: 'shop/yack/sav/product_after_sales_link.html.twig'
                priority: -50

        'sylius_shop.base.header.content':
            logo:
                template: 'shop/yack/layout/header_logo.html.twig'
            yack_search:
                template: 'shop/yack/layout/header_search.html.twig'
                priority: 250
            cart:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }

        'sylius_shop.base.offcanvas':
            cart:
                configuration: { yack_permission: 'YACK_PLACE_ORDER' }

        # --- Escompte selon le moyen de paiement (App\OrderProcessing\EscompteProcessor)
        'sylius_shop.shared.form.select_payment.payment.choice.details':
            yack_escompte:
                template: 'shop/yack/checkout/payment_escompte_badge.html.twig'
                priority: -10

        'sylius_shop.checkout.common.sidebar.summary.total':
            yack_escompte:
                template: 'shop/yack/checkout/sidebar_escompte.html.twig'
                priority: 250

        'sylius_admin.order.show.content.sections.summary':
            yack_escompte:
                template: 'admin/yack/order/summary_escompte.html.twig'
                priority: -10

        # --- Habillage Yack (léger)
        'sylius_shop.base.header.top_bar':
            info_message:
                template: 'shop/yack/layout/top_bar_message.html.twig'
            yack_profile:
                template: 'shop/yack/layout/top_bar_profile.html.twig'
                priority: 50

        'sylius_shop.base.header.content.logo':
            content:
                template: 'shop/yack/layout/logo.html.twig'

        'sylius_shop.base.footer.content':
            payment_methods:
                enabled: false
            copy:
                template: 'shop/yack/layout/footer_copy.html.twig'

        'sylius_shop.checkout.common.header':
            logo:
                template: 'shop/yack/layout/checkout_logo.html.twig'

        'sylius_shop.base.header.content.security.logged_in_user.desktop':
            welcome_message:
                template: 'shop/yack/layout/welcome_message.html.twig'

        'sylius_shop.base.header.navbar.menu':
            yack_links_before:
                template: 'shop/yack/layout/menu_links_before.html.twig'
                priority: 100
            yack_links:
                template: 'shop/yack/layout/menu_links.html.twig'
                priority: -100

        'sylius_shop.homepage.index':
            banner:
                template: 'shop/yack/homepage/hero.html.twig'
            new_collection:
                enabled: false
