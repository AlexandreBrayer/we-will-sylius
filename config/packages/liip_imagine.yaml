liip_imagine:
    resolvers:
        default:
            web_path:
                web_root: "%kernel.project_dir%/public"
                cache_prefix: "media/cache"

    # Vignettes des produits : photo entière (pas de recadrage), centrée sur un carré blanc. Les photos du
    # catalogue réel sont de tous formats (unités murales très larges, groupes extérieurs hauts) : le
    # recadrage « outbound » de Sylius en coupait une partie. Après un changement ici :
    # bin/console liip:imagine:cache:remove (les vignettes se refont à la demande).
    filter_sets:
        sylius_shop_product_thumbnail:
            format: webp
            quality: 85
            filters:
                thumbnail: { size: [600, 600], mode: inset, allow_upscale: true }
                background: { size: [600, 600], position: center, color: '#ffffff' }
        sylius_shop_product_large_thumbnail:
            format: webp
            quality: 85
            filters:
                thumbnail: { size: [1200, 1200], mode: inset, allow_upscale: true }
                background: { size: [1200, 1200], position: center, color: '#ffffff' }
